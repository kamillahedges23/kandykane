name: KandyKane

options:
  bundleIdPrefix: kandykane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  KandyKane:
    type: application
    platform: iOS
    sources:
      - path: KandyKaneApp.swift
      - path: KandyKaneConfig.swift
      - path: FrameBridge.swift
      - path: ClaudeClient.swift
      - path: Assets.xcassets
    info:
      path: Info-App.plist
      properties:
        CFBundleDisplayName: KandyKane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kandykane.com
        PROVISIONING_PROFILE_SPECIFIER: kandykane
        CODE_SIGN_IDENTITY: "Apple Distribution"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: KandyKane.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kandykane
    dependencies:
      - target: KandyKaneBroadcast
        embed: true

  KandyKaneBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SampleHandler.swift
      - path: KandyKaneConfig.swift
      - path: FrameBridge.swift
    info:
      path: Info-Broadcast.plist
      properties:
        CFBundleDisplayName: KandyKane Broadcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kandykane.com.broadcast
        PROVISIONING_PROFILE_SPECIFIER: kandykane.broadcast
        CODE_SIGN_IDENTITY: "Apple Distribution"
    entitlements:
      path: KandyKaneBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kandykane

schemes:
  KandyKane:
    build:
      targets:
        KandyKane: all
        KandyKaneBroadcast: all
    archive:
      config: Release
