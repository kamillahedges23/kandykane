name: KandyKane

options:
  bundleIdPrefix: kandykane
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"

targets:
  KandyKane:
    type: application
    platform: iOS
    sources:
      - path: KandyKaneApp.swift
      - path: KandyKaneConfig.swift
      - path: FrameBridge.swift
      - path: ClaudeClient.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kandykane.com
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        # XcodeGen defaults each target to iPhone + iPad; this app is iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        # Replaced by CI with the name inside the installed profile.
        PROVISIONING_PROFILE_SPECIFIER: kandykane
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/KandyKane-Info.plist
      properties:
        CFBundleDisplayName: KandyKane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Generated/KandyKane.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kandykane
    dependencies:
      - target: KandyKaneBroadcast
        embed: true

  KandyKaneBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SampleHandler.swift
      - path: KandyKaneConfig.swift
      - path: FrameBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kandykane.com.broadcast
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        # XcodeGen defaults each target to iPhone + iPad; this app is iPhone-only.
        TARGETED_DEVICE_FAMILY: "1"
        # Replaced by CI with the name inside the installed profile.
        PROVISIONING_PROFILE_SPECIFIER: kandykane.com.broadcast
    info:
      path: Generated/KandyKaneBroadcast-Info.plist
      properties:
        CFBundleDisplayName: KandyKane Broadcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Generated/KandyKaneBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kandykane

schemes:
  KandyKane:
    build:
      targets:
        KandyKane: all
    archive:
      config: Release
