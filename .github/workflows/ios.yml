name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode'
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Set up signing
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_BROADCAST: ${{ secrets.PROFILE_BROADCAST }}
        run: |
          set -e
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" $KEYCHAIN
          rm cert.p12
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_APP" | base64 --decode > "$PROFILE_DIR/app.mobileprovision"
          echo "$PROFILE_BROADCAST" | base64 --decode > "$PROFILE_DIR/broadcast.mobileprovision"

      - name: Archive
        run: |
          xcodebuild archive \
            -project KandyKane.xcodeproj \
            -scheme KandyKane \
            -configuration Release \
            -archivePath build/KandyKane.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>kandykane.com</key>
              <string>kandykane</string>
              <key>kandykane.com.broadcast</key>
              <string>kandykane.broadcast</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export the .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/KandyKane.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Save the .ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: KandyKane-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls build/export/*.ipa | head -n1)" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
