name: Build and upload to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install certificate and provisioning profiles
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_BROADCAST: ${{ secrets.PROFILE_BROADCAST }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Secrets pasted into GitHub often pick up stray spaces or line
          # breaks; strip them so they can't break decoding or the password.
          CERT_PASSWORD=$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          printf '%s' "$CERT_P12" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          export CERT_PASSWORD
          if ! /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:CERT_PASSWORD -nokeys -noout 2>/dev/null; then
            echo "::error::CERT_PASSWORD does not open CERT_P12. Re-paste both secrets exactly as they appear in github-secrets.txt (whole line, nothing extra)."
            exit 1
          fi
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"

          # Xcode 16+ reads profiles from UserData; older Xcode from MobileDevice.
          NEW_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          OLD_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$NEW_DIR" "$OLD_DIR"

          install_profile() {
            local b64="$1" var="$2"
            local tmp="$RUNNER_TEMP/$var.mobileprovision"
            printf '%s' "$b64" | tr -d '[:space:]' | base64 --decode > "$tmp"
            security cms -D -i "$tmp" > "$RUNNER_TEMP/$var.plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/$var.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/$var.plist")
            cp "$tmp" "$NEW_DIR/$uuid.mobileprovision"
            cp "$tmp" "$OLD_DIR/$uuid.mobileprovision"
            echo "$var=$name" >> "$GITHUB_ENV"
            echo "Installed $var: $name ($uuid)"
          }
          install_profile "$PROFILE_APP" APP_PROFILE_NAME
          install_profile "$PROFILE_BROADCAST" BROADCAST_PROFILE_NAME

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          # Point each target at the profile name that was actually installed.
          sed -i '' "s|PROVISIONING_PROFILE_SPECIFIER: kandykane\.com\.broadcast$|PROVISIONING_PROFILE_SPECIFIER: \"$BROADCAST_PROFILE_NAME\"|" project.yml
          sed -i '' "s|PROVISIONING_PROFILE_SPECIFIER: kandykane$|PROVISIONING_PROFILE_SPECIFIER: \"$APP_PROFILE_NAME\"|" project.yml
          grep PROVISIONING_PROFILE_SPECIFIER project.yml
          xcodegen generate

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project KandyKane.xcodeproj \
            -scheme KandyKane \
            -configuration Release \
            -archivePath build/KandyKane.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Write export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>kandykane.com</key>
              <string>${APP_PROFILE_NAME}</string>
              <key>kandykane.com.broadcast</key>
              <string>${BROADCAST_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export the .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/KandyKane.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Save the .ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: KandyKane-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the .p8 either pasted as-is or base64-encoded.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode > "$KEY_FILE"
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls build/export/*.ipa | head -n1)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY_FILE"
